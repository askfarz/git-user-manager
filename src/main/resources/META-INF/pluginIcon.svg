<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <style>
        .background { fill: #212121; }
        .git-icon { fill: #F44336; stroke: #FFFFFF; stroke-width: 2; }
        .text { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; }
    </style>
    <rect class="background" width="240" height="240" rx="20" />

    <!-- Git Branch Icon (Centered and Larger) -->
    <g transform="translate(120, 120)">
        <!-- Main Circle -->
        <circle class="git-icon" cx="0" cy="-40" r="40" />

        <!-- Branch 1 -->
        <path class="git-icon" d="M40,-40 C40,-40 50,-20 60,-20 C70,-20 80,-40 80,-40" />
        <line class="git-icon" x1="60" y1="-20" x2="60" y2="20" />

        <!-- Branch 2 -->
        <path class="git-icon" d="M-40,-40 C-40,-40 -50,-20 -60,-20 C-70,-20 -80,-40 -80,-40" />
        <line class="git-icon" x1="-60" y1="-20" x2="-60" y2="20" />

        <!-- Commit Points -->
        <circle class="git-icon" cx="60" cy="20" r="5" />
        <circle class="git-icon" cx="-60" cy="20" r="5" />
    </g>

    <!-- Text "Inteleji Git" -->
    <text class="text" x="120" y="190" text-anchor="middle">Git User Manager</text>
    <text class="text" x="120" y="220" text-anchor="middle" font-size="18px">Plugin</text>
</svg>
